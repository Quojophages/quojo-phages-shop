
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quojo Phages Online Shop</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
header{background:#10243a;color:white;padding:15px}
.top{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:bold}.logo span{color:#ff8a24}
.search{display:flex;flex:1;max-width:550px}
.search input{width:100%;padding:12px;border:0;border-radius:5px 0 0 5px}
.search button{background:#f58220;color:white;border:0;padding:12px;border-radius:0 5px 5px 0}
.cart{background:#f58220;color:white;padding:11px;border:0;border-radius:5px}
main{max-width:1200px;margin:auto;padding:15px}
.hero{background:linear-gradient(110deg,#10243a,#315c7b);color:white;padding:40px 25px;border-radius:10px;margin:10px 0 22px}
.hero h1{font-size:32px;margin:0 0 10px}
.hero p{font-size:17px}
.hero a{display:inline-block;background:#f58220;color:white;padding:12px 20px;text-decoration:none;border-radius:5px}
h2{font-size:21px}
.categories{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px}
.category{background:white;border:1px solid #ddd;padding:12px 17px;border-radius:6px;white-space:nowrap;cursor:pointer}
.category.active{background:#f58220;color:white}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.product{background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 7px #0001}
.product img{width:100%;height:160px;object-fit:contain;padding:10px}
.info{padding:12px}
.info h3{font-size:15px;min-height:35px}
.price{color:#f58220;font-weight:bold;font-size:19px}
.add{width:100%;padding:11px;background:#f58220;color:white;border:0;border-radius:5px}
footer{background:#10243a;color:white;text-align:center;padding:28px;margin-top:35px}
footer a{color:#ffad64}
.empty{background:white;padding:25px;text-align:center;grid-column:1/-1}
@media(max-width:700px){.products{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:25px}}
</style>
</head>
<body>
<header>
<div class="top">
<div class="logo">QUOJO <span>PHAGES</span></div>
<div class="search">
<input id="search" placeholder="Search for products..." oninput="render()">
<button onclick="render()">Search</button>
</div>
<button class="cart" onclick="showCart()">🛒 Cart (<span id="count">0</span>)</button>
</div>
</header>

<main>
<section class="hero">
<h1>Shop Smart. Live Better.</h1>
<p>Discover amazing products at great prices.</p>
<a href="#shop">Start Shopping</a>
</section>

<h2>Shop by Category</h2>
<div class="categories" id="categories">
<button class="category active" onclick="filter('All',this)">All Products</button>
</div>

<section id="shop">
<h2>Featured Products</h2>
<div class="products" id="products">
<div class="empty">Loading products...</div>
</div>
</section>
</main>

<footer>
<h2>QUOJO PHAGES ONLINE SHOP</h2>
<p>Shop Smart. Live Better.</p>
<p>WhatsApp: <a href="https://wa.me/233556719652">0556719652</a></p>
<p>© 2026 Quojo Phages Online Shop</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient(
"https://ccyltqbmepftkclzkeui.supabase.co",
"sb_publishable__B512z3E_pMCr2OA6nCr9A_kcpbHbBp"
);
let products=[];
let category="All";
let cart=JSON.parse(localStorage.getItem("quojoCart")||"[]");

async function load(){
const box=document.getElementById("products");
try{
const {data,error}=await db.from("products")
.select("id,name,selling_price,stock_quantity,image_url,category_id")
.eq("is_active",true);
if(error)throw error;
products=data||[];
render();
loadCategories();
}catch(e){
box.innerHTML='<div class="empty">Products could not load. Please check your database permissions.</div>';
console.error(e);
}
}

async function loadCategories(){
const {data,error}=await db.from("categories").select("*").order("name");
if(error||!data)return;
const box=document.getElementById("categories");
data.forEach(c=>{
const b=document.createElement("button");
b.className="category";
b.textContent=c.name;
b.onclick=()=>filter(c.id,b);
box.appendChild(b);
});
}

function filter(value,button){
category=value;
document.querySelectorAll(".category").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
render();
}

function render(){
const term=document.getElementById("search").value.toLowerCase();
const list=products.filter(p=>
(category==="All"||p.category_id===category)&&
(p.name||"").toLowerCase().includes(term)
);
const box=document.getElementById("products");
if(!list.length){
box.innerHTML='<div class="empty">No products available yet. Please check back soon.</div>';
return;
}
box.innerHTML=list.map(p=>`
<div class="product">
<img src="${safe(p.image_url||"https://placehold.co/300x200?text=Quojo+Product")}" alt="${safe(p.name)}">
<div class="info">
<h3>${safe(p.name)}</h3>
<div class="price">GH₵ ${Number(p.selling_price).toFixed(2)}</div>
<p>${Number(p.stock_quantity)>0?"In stock":"Out of stock"}</p>
<button class="add" ${Number(p.stock_quantity)<=0?"disabled":""} onclick="add('${p.id}')">Add to Cart</button>
</div>
</div>`).join("");
}

function safe(s){
return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function add(id){
const p=products.find(x=>x.id===id);
if(!p)return;
const item=cart.find(x=>x.id===id);
if(item)item.quantity++;
else cart.push({...p,quantity:1});
save();
alert("Added to cart!");
}

function save(){
localStorage.setItem("quojoCart",JSON.stringify(cart));
document.getElementById("count").textContent=cart.reduce((n,p)=>n+p.quantity,0);
}

function showCart(){
if(!cart.length){alert("Your cart is empty.");return;}
let message="Hello Quojo Phages, I want to order:\n\n";
cart.forEach(p=>message+=p.name+" x "+p.quantity+" = GH₵ "+(p.selling_price*p.quantity).toFixed(2)+"\n");
message+="\nTotal: GH₵ "+cart.reduce((n,p)=>n+p.quantity*p.selling_price,0).toFixed(2);
if(confirm(message+"\n\nContinue to WhatsApp?")){
window.open("https://wa.me/233556719652?text="+encodeURIComponent(message),"_blank");
}
}

save();
load();
</script>
</body>
</html>
