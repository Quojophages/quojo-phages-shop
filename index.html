
<!DOCTYPE html>

<style>
:root{--orange:#f58220;--navy:#10243a}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
header{background:var(--navy);color:white;padding:15px}
.top{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{font-size:22px;font-weight:bold}
.logo span{color:var(--orange)}
button{cursor:pointer;padding:12px;border:0;border-radius:5px}
.orange,.add{background:var(--orange);color:white}
main{max-width:1100px;margin:auto;padding:15px}
.search input,.field{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #ccc;border-radius:5px}
.search{display:flex;flex:1;max-width:500px}
.search input{margin:0}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.product{background:white;border-radius:8px;overflow:hidden}
.product img{width:100%;height:160px;object-fit:contain;padding:10px}
.info{padding:12px}
.price{color:var(--orange);font-size:19px;font-weight:bold}
.add{width:100%}
.categories{display:flex;gap:8px;overflow:auto;margin-bottom:15px}
.category{background:white;border:1px solid #ddd;white-space:nowrap}
.category.active{background:var(--orange);color:white}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:12px}
.modal-box{background:white;width:100%;max-width:440px;padding:20px;border-radius:9px;max-height:90vh;overflow:auto}
.modal-box button{width:100%;margin:5px 0}
.close{background:#ddd}
.notice{font-size:13px;color:#666}
.cart-row{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
.cart-row img{width:64px;height:64px;object-fit:contain;background:#f7f7f7;border-radius:6px}
.cart-item-name{font-weight:bold;margin:0 0 5px}
.cart-controls{display:flex;align-items:center;gap:8px;margin-top:8px}
.cart-controls button{padding:7px 11px;background:#eee}
.cart-controls .remove{background:#ffe5e5;color:#a00}
.cart-summary{font-weight:bold;font-size:18px;margin:18px 0}
.cart-empty{text-align:center;padding:20px 0;color:#666}
.order-card{border:1px solid #ddd;border-radius:7px;padding:12px;margin:10px 0}
.detail-image{width:100%;max-height:300px;object-fit:contain;background:#f7f7f7;border-radius:7px}.gallery-thumbs{display:flex;gap:8px;overflow-x:auto;margin:8px 0 14px}.gallery-thumbs img{width:64px;height:64px;object-fit:cover;border:2px solid #ddd;border-radius:6px;cursor:pointer}.gallery-thumbs img.active{border-color:var(--orange)}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buy-now{background:var(--navy);color:white}.spec-list{background:#f7f7f7;padding:12px;border-radius:7px;white-space:pre-line}.quantity-select{display:flex;align-items:center;gap:12px;margin:12px 0}.quantity-select button{background:#eee;padding:8px 14px}.quantity-select strong{min-width:24px;text-align:center}.related-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.related-card{border:1px solid #eee;border-radius:7px;padding:8px;cursor:pointer}.related-card img{width:100%;height:90px;object-fit:contain}.variant-label{display:block;font-weight:bold;margin:12px 0 4px}.variant-select{width:100%;padding:12px;border:1px solid #ccc;border-radius:5px;margin-bottom:12px}.review-card{border-bottom:1px solid #eee;padding:10px 0}.stars{color:#f58220;font-size:18px}
.order-status{font-weight:bold;color:#f58220;text-transform:capitalize}
.order-track{background:#f7f7f7;border-radius:5px;padding:9px;margin-top:8px;font-size:13px}
footer{background:var(--navy);color:white;text-align:center;padding:25px;margin-top:30px}
footer a{color:#ffad64}
@media(max-width:700px){.products{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header>
<div class="top">
<div class="logo">QUOJO <span>PHAGES</span></div>
<div class="search">
<input id="search" placeholder="Search products..." oninput="renderProducts()">
<button class="orange" onclick="renderProducts()">Search</button>
</div>
<button class="orange" onclick="openAccount()">Account</button>

<main>
<section>
<h1>Shop Smart. Live Better.</h1>

</section>
<h2>Shop by Category</h2>

</div>
<h2>Our Products</h2>

</main>

<div class="modal" id="accountModal">

<h2>Customer Account</h2>

<div class="modal" id="productModal"><div class="modal-box"><button class="close" onclick="closeProductDetails()">Close</button><div id="productDetails"></div></div></div>

<option value="MTN MoMo">MTN Mobile Money</option>

<footer>
<h2>QUOJO PHAGES ONLINE SHOP</h2>
<p>Shop Smart. Live Better.</p>
<p>WhatsApp: <a href="https://wa.me/233556719652">0556719652</a></p>
<p>© 2026 Quojo Phages Online Shop</p>
</footer>

<script>
const db = supabase.createClient(
 "https://ccyltqbmepftkclzkeui.supabase.co",
 "sb_publishable__B512z3E_pMCr2OA6nCr9A_kcpbHbBp"
);

let allProducts = [];
let categoryNames = {};
let selectedCategory = "All";

function getProductImage(product) {
 if (product.image_url) return product.image_url;
 const label = encodeURIComponent(product.name || "Product photo needed");
 return "https://placehold.co/600x600/f3f4f6/333333?text=" + label;
}
let cart = JSON.parse(localStorage.getItem("quojoCart") || "[]");

function saveCart(){
 localStorage.setItem("quojoCart", JSON.stringify(cart));
 document.getElementById("count").textContent =
  cart.reduce((n,p)=>n+p.quantity,0);
}

async function loadProducts(){
 const box = document.getElementById("products");
 const {data,error} = await db.from("products")
  .select("id,name,description,selling_price,stock_quantity,image_url,category_id,variants,additional_images,specifications")
  .eq("is_active",true)
  .order("created_at",{ascending:false});

 if(error){
  box.innerHTML = "<p>Products could not load. Please try again.</p>";
  console.error(error);
  return;
 }

 allProducts = data || [];
 await loadCategories();
 renderProducts();
}

async function loadCategories(){
 const box = document.getElementById("categories");
 const {data,error} = await db.from("categories").select("*").order("name");
 if(error || !data) return;

 box.innerHTML = "";
 const all = document.createElement("button");
 all.className = "category active";
 all.textContent = "All Products";
 all.onclick = ()=>filterCategory("All",all);
 box.appendChild(all);

 data.forEach(c=>{
  categoryNames[c.id] = c.name;
  const b = document.createElement("button");
  b.className = "category";
  b.textContent = c.name;
  b.onclick = ()=>filterCategory(c.id,b);
  box.appendChild(b);
 });
}

function filterCategory(value,button){
 selectedCategory = value;
 document.querySelectorAll(".category").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 renderProducts();
}

function renderProducts(){
 const term = document.getElementById("search").value
  .toLowerCase().trim().replace(/[^a-z0-9\\s-]/g," ");
 const searchTerms = term.split(/\\s+/).filter(Boolean);
 const list = allProducts.filter(p=>{
  const category = categoryNames[p.category_id] || "";
  const searchable = [
   p.name, p.description, category, p.specifications, p.variants
  ].filter(Boolean).join(" ").toLowerCase();
  const matchesSearch = searchTerms.length===0 ||
   searchTerms.every(word=>searchable.includes(word));
  return (selectedCategory==="All" || p.category_id===selectedCategory)
   && matchesSearch;
 });
 const box = document.getElementById("products");

 if(!list.length){
  box.innerHTML = "<p>No matching products found. Try another name or category.</p>";
  return;
 }

 box.innerHTML = list.map(p=>`
  <article class="product">
   <img src="${getProductImage(p)}" alt="${p.name}" onerror="this.onerror=null;this.src='https://placehold.co/300x200?text=Quojo'">
   <div class="info">
    <h3 onclick="openProductDetails(&quot;${p.id}&quot;)" style="cursor:pointer">${p.name}</h3>
    <p class="price">GH₵ ${Number(p.selling_price).toFixed(2)}</p>
    <p>Stock: ${Number(p.stock_quantity)}</p>
    <button class="add" ${Number(p.stock_quantity)<=0?"disabled":""}
     onclick="${p.variants && p.variants.trim() ? `openProductDetails('${p.id}')` : `addToCart('${p.id}')`}">Add to Cart</button>
   </div>
  </article>
 `).join("");
}

async function openProductDetails(id){
 const p=allProducts.find(x=>x.id===id); if(!p)return;
 const box=document.getElementById('productDetails'); box.innerHTML='';
 const gallery=[p.image_url,...(Array.isArray(p.additional_images)?p.additional_images:[])].filter(Boolean);
 const image=document.createElement('img'); image.className='detail-image'; image.src=gallery[0]||getProductImage(p); image.alt=p.name;
 const thumbs=document.createElement('div'); thumbs.className='gallery-thumbs';
 gallery.forEach(function(url,index){const t=document.createElement('img');t.src=url;t.alt=p.name+' image '+(index+1);if(index===0)t.classList.add('active');t.onclick=function(){image.src=url;thumbs.querySelectorAll('img').forEach(x=>x.classList.remove('active'));t.classList.add('active');};thumbs.appendChild(t);});
 const name=document.createElement('h2');name.textContent=p.name;
 const price=document.createElement('p');price.className='price';price.textContent='GH₵ '+Number(p.selling_price).toFixed(2);
 const desc=document.createElement('p');desc.textContent=p.description||'No description has been added yet.';
 const stock=document.createElement('p');stock.textContent='Available stock: '+Number(p.stock_quantity);
 const specsHeading=document.createElement('h3');specsHeading.textContent='Product specifications';
 const specs=document.createElement('div');specs.className='spec-list';specs.textContent=p.specifications||'Specifications have not been added yet.';
 const options=(p.variants||'').split(',').map(x=>x.trim()).filter(Boolean);
 const optionLabel=document.createElement('label');optionLabel.className='variant-label';optionLabel.textContent='Choose size, colour or type';
 const select=document.createElement('select');select.className='variant-select';
 if(options.length){const first=document.createElement('option');first.value='';first.textContent='Select an option';select.appendChild(first);options.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o);});}
 else{const o=document.createElement('option');o.value='';o.textContent='No option required';select.appendChild(o);select.disabled=true;}
 const qtyTitle=document.createElement('label');qtyTitle.className='variant-label';qtyTitle.textContent='Quantity';
 const qtyBox=document.createElement('div');qtyBox.className='quantity-select';
 const minus=document.createElement('button');minus.type='button';minus.textContent='−';
 const qtyText=document.createElement('strong');qtyText.textContent='1';
 const plus=document.createElement('button');plus.type='button';plus.textContent='+';
 let qty=1;minus.onclick=()=>{qty=Math.max(1,qty-1);qtyText.textContent=qty;};plus.onclick=()=>{if(qty<Number(p.stock_quantity)){qty++;qtyText.textContent=qty;}};
 qtyBox.append(minus,qtyText,plus);
 const deliveryTitle=document.createElement('h3');deliveryTitle.textContent='Delivery information';
 const delivery=document.createElement('p');delivery.textContent='Delivery options and fees are confirmed during checkout based on your delivery location.';
 const actions=document.createElement('div');actions.className='detail-actions';
 const add=document.createElement('button');add.className='orange';add.textContent='Add to Cart';
 const buy=document.createElement('button');buy.className='buy-now';buy.textContent='Buy Now';
 add.disabled=buy.disabled=Number(p.stock_quantity)<=0;
 function addSelected(goCheckout){if(options.length&&!select.value){alert('Please select an option first.');return;}addToCart(p.id,select.value,qty);closeProductDetails();if(goCheckout){showCart();proceedToCheckout();}}
 add.onclick=()=>addSelected(false);buy.onclick=()=>addSelected(true);actions.append(add,buy);
 const reviewTitle=document.createElement('h3');reviewTitle.textContent='Customer Reviews';
 const reviews=document.createElement('div');reviews.id='productReviews';reviews.textContent='Loading reviews...';
 const rating=document.createElement('select');rating.className='field';rating.id='reviewRating';
 for(let n=5;n>=1;n--){const o=document.createElement('option');o.value=String(n);o.textContent=n+' stars';rating.appendChild(o);}
 const review=document.createElement('textarea');review.className='field';review.id='reviewText';review.placeholder='Write your review';review.rows=3;
 const submit=document.createElement('button');submit.className='orange';submit.textContent='Submit Review';submit.onclick=()=>submitProductReview(id);
 const relatedTitle=document.createElement('h3');relatedTitle.textContent='Similar products';
 const related=document.createElement('div');related.className='related-grid';
 allProducts.filter(x=>x.id!==p.id&&x.category_id===p.category_id).slice(0,4).forEach(x=>{const card=document.createElement('div');card.className='related-card';const pic=document.createElement('img');pic.src=getProductImage(x);const title=document.createElement('strong');title.textContent=x.name;const cost=document.createElement('p');cost.className='price';cost.textContent='GH₵ '+Number(x.selling_price).toFixed(2);card.append(pic,title,cost);card.onclick=()=>openProductDetails(x.id);related.appendChild(card);});
 box.append(image);if(gallery.length>1)box.append(thumbs);box.append(name,price,desc,stock);
 if(p.specifications)box.append(specsHeading,specs);
 if(options.length)box.append(optionLabel,select);
 box.append(qtyTitle,qtyBox,deliveryTitle,delivery,actions,reviewTitle,reviews,rating,review,submit);
 if(related.childElementCount)box.append(relatedTitle,related);
 document.getElementById('productModal').style.display='flex';await loadProductReviews(id);
}
function closeProductDetails(){document.getElementById('productModal').style.display='none';}
async function loadProductReviews(id){
 const box=document.getElementById('productReviews');
 const result=await db.from('product_reviews').select('rating,review_text,created_at').eq('product_id',id).order('created_at',{ascending:false});
 if(result.error){box.textContent='Reviews could not be loaded.';return;}
 if(!result.data||!result.data.length){box.textContent='No customer reviews yet. Be the first to review this product.';return;}
 box.innerHTML='';
 result.data.forEach(function(r){const card=document.createElement('div');card.className='review-card';const stars=document.createElement('div');stars.className='stars';stars.textContent='★'.repeat(r.rating)+'☆'.repeat(5-r.rating);const body=document.createElement('p');body.textContent=r.review_text;const date=document.createElement('small');date.textContent=new Date(r.created_at).toLocaleDateString();card.append(stars,body,date);box.appendChild(card);});
}
async function submitProductReview(id){
 const box=document.getElementById('productReviews');
 const sessionResult=await db.auth.getSession();
 if(sessionResult.error||!sessionResult.data.session){box.textContent='Please log in to submit a review.';return;}
 const reviewText=document.getElementById('reviewText').value.trim();
 const rating=Number(document.getElementById('reviewRating').value);
 if(!reviewText){alert('Please write your review.');return;}
 const result=await db.from('product_reviews').insert({product_id:id,user_id:sessionResult.data.session.user.id,rating:rating,review_text:reviewText});
 if(result.error){box.textContent=result.error.code==='23505'?'You have already reviewed this product.':result.error.message;return;}
 document.getElementById('reviewText').value=''; await loadProductReviews(id);
}

function addToCart(id,selectedVariant='',quantity=1){
 const p = allProducts.find(x=>x.id===id);
 if(!p) return;

 const item = cart.find(x=>x.id===id);
 if(item){
  if(item.quantity>=Number(p.stock_quantity)){
   alert("No more stock available.");
   return;
  }
  item.quantity=Math.min(Number(p.stock_quantity),item.quantity+Number(quantity));
  item.selected_variant=selectedVariant;
 }else{
  cart.push({...p,selected_variant:selectedVariant,quantity:Number(quantity)});
 }
 saveCart();
 alert("Product added to your cart.");
}

async function openAccount(){
 document.getElementById("accountModal").style.display="flex";
 await checkSession();
}

function closeAccount(){
 document.getElementById("accountModal").style.display="none";
}

async function loadMyOrders(){
 const box=document.getElementById("myOrders");
 box.innerHTML="<p>Loading your orders...</p>";
 const {data:sessionData,error:sessionError}=await db.auth.getSession();
 if(sessionError || !sessionData.session){
  box.textContent="Please log in to view your orders.";
  return;
 }
 const {data:orders,error}=await db.from("orders")
  .select("id,total_amount,status,payment_status,created_at")
  .eq("customer_id",sessionData.session.user.id)
  .order("created_at",{ascending:false});
 if(error){
  box.textContent="Your orders could not be loaded: "+error.message;
  return;
 }
 if(!orders || !orders.length){
  box.textContent="You have not placed any orders yet.";
  return;
 }
 box.innerHTML="";
 orders.forEach(order=>{
  const card=document.createElement("div");
  card.className="order-card";
  const heading=document.createElement("strong");
  heading.textContent="Order #"+order.id;
  const date=document.createElement("p");
  date.textContent="Date: "+new Date(order.created_at).toLocaleString();
  const total=document.createElement("p");
  total.textContent="Total: GH₵ "+Number(order.total_amount).toFixed(2);
  const payment=document.createElement("p");
  payment.textContent="Payment: "+(order.payment_status||"pending");
  const progress=document.createElement("p");
  progress.className="order-status";
  progress.textContent="Order status: "+(order.status||"pending");
  const note=document.createElement("div");
  note.className="order-track";
  const status=(order.status||"pending").toLowerCase();
  note.textContent=status==="completed"?"Your order has been completed."
   :status==="cancelled"?"This order has been cancelled. Please contact our support if you need help."
   :status==="processing"?"Your order is being prepared."
   :status==="confirmed"?"Your order has been confirmed."
   :"Your order has been received and is awaiting processing.";
  card.append(heading,date,total,payment,progress,note);
  box.appendChild(card);
 });
}

async function register(){
 const fullName=document.getElementById("fullName").value.trim();
 const email=document.getElementById("email").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("accountMessage");

 if(!fullName || !email || password.length<6){
  msg.textContent="Enter your name, email and a password of at least 6 characters.";
  return;
 }

 msg.textContent="Creating your account...";
 const {data,error}=await db.auth.signUp({
  email,password,options:{data:{full_name:fullName,phone}}
 });

 if(error){
  msg.textContent=error.message;
  return;
 }

 msg.textContent=data.session
  ?"Account created. You can now shop."
  :"Account created. Check your email to verify, then log in.";
 await checkSession();
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("accountMessage");

 if(!email || !password){
  msg.textContent="Enter your email and password.";
  return;
 }

 msg.textContent="Logging in...";
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){
  msg.textContent=error.message;
  return;
 }

 msg.textContent="Welcome back. You can now checkout.";
 await checkSession();
}

async function logout(){
 const {error}=await db.auth.signOut();
 document.getElementById("accountMessage").textContent=
  error ? error.message : "You have logged out.";
 await checkSession();
}

async function checkSession(){
 const {data,error}=await db.auth.getSession();
 if(error) return;

 const session=data.session;
 document.getElementById("accountForm").style.display=
  session ? "none" : "block";
 document.getElementById("loggedIn").style.display=
  session ? "block" : "none";

 const adminLink=document.getElementById("adminDashboardLink");
 if(adminLink) adminLink.style.display="none";
 if(session){
  document.getElementById("welcome").textContent=
   "Welcome, "+(session.user.user_metadata.full_name || session.user.email);
  const {data:profile}=await db.from("profiles").select("role").eq("id",session.user.id).maybeSingle();
  if(adminLink && profile && profile.role==="admin") adminLink.style.display="block";
 }
}

/* CART AND CHECKOUT FUNCTIONS */

function showCart(){
 renderCart();
 document.getElementById("cartModal").style.display="flex";
}

function closeCart(){
 document.getElementById("cartModal").style.display="none";
}

function cartTotal(){
 return cart.reduce((n,p)=>n+Number(p.selling_price)*Number(p.quantity),0);
}

function renderCart(){
 const box=document.getElementById("cartItems");
 const total=document.getElementById("cartReviewTotal");
 const checkout=document.getElementById("continueCheckoutButton");

 if(!cart.length){
  box.innerHTML='<p class="cart-empty">Your cart is empty. Add some products to get started.</p>';
  total.textContent="";
  checkout.disabled=true;
  return;
 }

 checkout.disabled=false;
 box.innerHTML=cart.map(p=>`
  <div class="cart-row">
   <img src="${getProductImage(p)}" alt="${p.name}" onerror="this.onerror=null;this.src=\'https://placehold.co/120x120?text=Quojo\'">
   <div>
    <p class="cart-item-name">${p.name}</p>
    ${p.selected_variant ? `<div>Selected: ${p.selected_variant}</div>` : ''}
    <div>GH₵ ${Number(p.selling_price).toFixed(2)} each</div>
    <div class="cart-controls">
     <button onclick="changeCartQty('${p.id}',-1)" aria-label="Decrease quantity">−</button>
     <strong>${Number(p.quantity)}</strong>
     <button onclick="changeCartQty('${p.id}',1)" aria-label="Increase quantity">+</button>
     <button class="remove" onclick="removeCartItem('${p.id}')">Remove</button>
    </div>
   </div>
  </div>
 `).join("");

 total.textContent="Total: GH₵ "+cartTotal().toFixed(2);
}

function changeCartQty(id,change){
 const item=cart.find(p=>p.id===id);
 if(!item) return;

 const product=allProducts.find(p=>p.id===id);
 const stock=Number(product ? product.stock_quantity : item.stock_quantity);
 const next=Number(item.quantity)+change;

 if(next<=0){
  removeCartItem(id);
  return;
 }
 if(Number.isFinite(stock) && next>stock){
  alert("No more stock available.");
  return;
 }

 item.quantity=next;
 saveCart();
 renderCart();
}

function removeCartItem(id){
 cart=cart.filter(p=>p.id!==id);
 saveCart();
 renderCart();
}

async function proceedToCheckout(){
 if(!cart.length) return;

 const {data,error}=await db.auth.getSession();
 if(error){
  alert(error.message);
  return;
 }

 if(!data.session){
  closeCart();
  await openAccount();
  document.getElementById("accountMessage").textContent=
   "Please log in before checkout. Your cart has been saved.";
  return;
 }

 document.getElementById("checkoutTotal").textContent=
  "Order total: GH₵ "+cartTotal().toFixed(2);
 document.getElementById("checkoutMessage").textContent="";
 document.getElementById("placeOrderButton").disabled=false;
 closeCart();
 document.getElementById("checkoutModal").style.display="flex";
}

function closeCheckout(){
 document.getElementById("checkoutModal").style.display="none";
}

async function submitCheckout(){
 const recipient=document.getElementById("deliveryName").value.trim();
 const phone=document.getElementById("deliveryPhone").value.trim();
 const region=document.getElementById("deliveryRegion").value.trim();
 const city=document.getElementById("deliveryCity").value.trim();
 const address=document.getElementById("deliveryAddress").value.trim();
 const payment=document.getElementById("paymentMethod").value;
 const msg=document.getElementById("checkoutMessage");
 const btn=document.getElementById("placeOrderButton");

 if(!recipient || !phone || !region || !city || !address){
  msg.textContent="Please complete all delivery details.";
  return;
 }

 if(!cart.length){
  msg.textContent="Your cart is empty.";
  return;
 }

 btn.disabled=true;
 msg.textContent="Saving your order...";

 try{
  const {data:sessionData,error:sessionError}=await db.auth.getSession();

  if(sessionError) throw sessionError;
  if(!sessionData.session) throw new Error("Please log in again.");

  const items=cart.map(p=>({
   product_id:p.id,
   quantity:Number(p.quantity),
   selected_variant:p.selected_variant||''
  }));

  const {data:orderId,error}=await db.rpc("place_shop_order",{
   p_recipient_name:recipient,
   p_phone:phone,
   p_region:region,
   p_city:city,
   p_address_details:address,
   p_payment_method:payment,
   p_items:items
  });

  if(error) throw error;
  const {error: variantSaveError}=await db.rpc('save_order_item_variants',{p_order_id:orderId,p_items:items});
  if(variantSaveError) throw new Error('Your order was created, but saving the selected product options failed: '+variantSaveError.message+'. Please contact the shop before placing another order.');
const { data: savedOrder, error: orderFetchError } = await db
  .from("orders")
  .select("total_amount")
  .eq("id", orderId)
  .single();

if (!orderFetchError && savedOrder) {
  const { error: emailError } = await db.functions.invoke(
    "send-order-email",
    {
      body: {
        order_id: orderId,
        total_amount: savedOrder.total_amount
      }
    }
  );

  if (emailError) {
    console.error("Email notification failed:", emailError);
  }
}
  if(payment==="Paystack" || payment==="MTN MoMo" || payment==="Telecel Cash" || payment==="AT Money"){
   msg.textContent=payment==="MTN MoMo"
    ? "Opening Paystack to request your MTN Mobile Money approval..."
    : payment==="Telecel Cash"
    ? "Opening Paystack to request your Telecel Cash approval..."
    : "Starting secure Paystack payment...";
   const {data:paymentData,error:paymentError}=await db.functions.invoke(
    "paystack-payment",
    {body:{action:"initialize",order_id:orderId}}
   );
   if(paymentError) throw paymentError;
   if(!paymentData || !paymentData.authorization_url){
    throw new Error(paymentData?.error || "Paystack could not start this payment.");
   }
   window.location.href=paymentData.authorization_url;
   return;
  }

  cart=[];
  saveCart();
  closeCheckout();

  alert("Your order has been placed successfully! Order number: "+orderId);

  window.location.href=
   "https://wa.me/233556719652?text="+
   encodeURIComponent(
    "Hello, I have placed order "+orderId+
    ". Payment method: "+payment+
    ". Please guide me with payment."
   );

 }catch(error){
  msg.textContent=error.message;
  btn.disabled=false;
 }
}

db.auth.onAuthStateChange(()=>checkSession());

saveCart();
loadProducts();
</script>
</body>
</html>
