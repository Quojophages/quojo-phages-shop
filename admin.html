
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quojo Phages Online Shop - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
header{background:#f58220;color:white;padding:20px}
header h2{margin:0}
main{max-width:950px;margin:auto;padding:15px}
section{background:white;padding:18px;margin:15px 0;border-radius:10px;box-shadow:0 2px 7px #ddd}
input,select,textarea,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px;font-size:15px}
button{background:#f58220;color:white;border:0;font-weight:bold;cursor:pointer}
.secondary{background:#333}
.danger{background:#b3261e}
.item{padding:14px 0;border-bottom:1px solid #ddd;overflow:auto}
.item img{width:65px;height:65px;object-fit:cover;float:right;border-radius:6px}
.hidden{display:none}
.small{font-size:13px;color:#666}
.message{font-size:14px}
</style>
</head>
<body>

<header>
<h2>QUOJO PHAGES</h2>
<p>Online Shop - Admin Dashboard</p>
</header>

<main>
<section id="loginBox">
<h3>Administrator Login</h3>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMessage" class="message"></p>
</section>

<div id="dashboard" class="hidden">

<section>
<h3>Welcome, Administrator</h3>
<button class="secondary" onclick="loadAll()">Refresh Dashboard</button>
<button class="danger" onclick="logout()">Logout</button>
<p id="status"></p>
</section>

<section>
<h3>Add New Product</h3>
<input id="productName" placeholder="Product name">
<textarea id="productDescription" placeholder="Product description"></textarea>

<label>Category</label>
<select id="categorySelect">
<option value="">Loading categories...</option>
</select>

<label>Store</label>
<select id="storeSelect">
<option value="">Loading stores...</option>
</select>

<input id="imageUrl" type="url" placeholder="Product image URL">
<input id="sellingPrice" type="number" min="0" step="0.01" placeholder="Selling price (GH₵)">
<input id="stockQuantity" type="number" min="0" step="1" placeholder="Stock quantity">

<button onclick="addProduct()">Save Product</button>
<p id="productMessage" class="message"></p>
</section>

<section>
<h3>Manage Products</h3>
<div id="productsList">Loading products...</div>
</section>

<section>
<h3>Categories</h3>
<div id="categoriesList">Loading categories...</div>
</section>

<section>
<h3>Store Information</h3>
<div id="storesList">Loading stores...</div>
</section>

</div>
</main>

<script>
const SUPABASE_URL = "https://ccyltqbmepftkclzkeui.supabase.co";
const SUPABASE_KEY = "sb_publishable__B512z3E_pMCr2OA6nCr9A_kcpbHbBp";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

function message(id, text) {
  document.getElementById(id).textContent = text;
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  message("loginMessage", "Signing in...");

  const {data, error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message("loginMessage", error.message);
    return;
  }

  currentUser = data.user;
  await checkAdmin();
}

async function checkAdmin() {
  const {data: profile, error} = await db
    .from("profiles")
    .select("role")
    .eq("id", currentUser.id)
    .single();

  if (error || !profile || profile.role !== "admin") {
    message("loginMessage", "Access denied. This account is not an administrator.");
    await db.auth.signOut();
    return;
  }

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  message("status", "Administrator access confirmed.");
  await loadAll();
}

async function loadAll() {
  await Promise.all([
    loadStores(),
    loadCategories(),
    loadProducts()
  ]);
}

async function loadStores() {
  const {data, error} = await db
    .from("stores")
    .select("id, store_name, status")
    .order("store_name");

  const list = document.getElementById("storesList");
  const select = document.getElementById("storeSelect");

  list.innerHTML = "";
  select.innerHTML = '<option value="">Choose store</option>';

  if (error) {
    list.textContent = error.message;
    return;
  }

  (data || []).forEach(store => {
    const item = document.createElement("div");
    item.className = "item";
    item.textContent = store.store_name + " - " + store.status;
    list.appendChild(item);

    if (store.status === "approved") {
      const option = document.createElement("option");
      option.value = store.id;
      option.textContent = store.store_name;
      select.appendChild(option);
    }
  });

  if (!data || data.length === 0) {
    list.textContent = "No stores found.";
  }
}

async function loadCategories() {
  const {data, error} = await db
    .from("categories")
    .select("id, name")
    .order("name");

  const select = document.getElementById("categorySelect");
  const list = document.getElementById("categoriesList");

  select.innerHTML = '<option value="">Choose category</option>';
  list.innerHTML = "";

  if (error) {
    list.textContent = error.message;
    return;
  }

  (data || []).forEach(category => {
    const option = document.createElement("option");
    option.value = category.id;
    option.textContent = category.name;
    select.appendChild(option);

    const item = document.createElement("div");
    item.className = "item";
    item.textContent = category.name;
    list.appendChild(item);
  });

  if (!data || data.length === 0) {
    list.textContent = "No categories found.";
  }
}

async function addProduct() {
  const name = document.getElementById("productName").value.trim();
  const description = document.getElementById("productDescription").value.trim();
  const categoryId = document.getElementById("categorySelect").value;
  const storeId = document.getElementById("storeSelect").value;
  const imageUrl = document.getElementById("imageUrl").value.trim();
  const priceText = document.getElementById("sellingPrice").value;
  const stockText = document.getElementById("stockQuantity").value;
  const price = Number(priceText);
  const stock = Number(stockText);

  if (!name || !categoryId || !storeId || priceText === "" ||
      stockText === "" || !Number.isFinite(price) ||
      !Number.isInteger(stock) || price < 0 || stock < 0) {
    message("productMessage", "Complete all required fields with valid values.");
    return;
  }

  if (imageUrl) {
    try {
      const url = new URL(imageUrl);
      if (!["https:", "http:"].includes(url.protocol)) throw new Error();
    } catch {
      message("productMessage", "Enter a valid image URL.");
      return;
    }
  }

  message("productMessage", "Saving product...");

  const {error} = await db.from("products").insert({
    store_id: storeId,
    category_id: categoryId,
    name: name,
    description: description,
    image_url: imageUrl || null,
    selling_price: price,
    stock_quantity: stock,
    is_active: true
  });

  if (error) {
    message("productMessage", "Could not save product: " + error.message);
    return;
  }

  message("productMessage", "Product added successfully!");

  ["productName","productDescription","imageUrl",
   "sellingPrice","stockQuantity"].forEach(id => {
    document.getElementById(id).value = "";
  });

  await loadProducts();
}

async function loadProducts() {
  const {data, error} = await db
    .from("products")
    .select("id, name, description, selling_price, stock_quantity, image_url, is_active")
    .order("name");

  const list = document.getElementById("productsList");
  list.innerHTML = "";

  if (error) {
    list.textContent = "Could not load products: " + error.message;
    return;
  }

  (data || []).forEach(product => {
    const item = document.createElement("div");
    item.className = "item";

    if (product.image_url) {
      const img = document.createElement("img");
      img.src = product.image_url;
      img.alt = product.name;
      item.appendChild(img);
    }

    const title = document.createElement("strong");
    title.textContent = product.name;

    const details = document.createElement("p");
    details.textContent =
      "Price: GH₵" + Number(product.selling_price).toFixed(2) +
      " | Stock: " + product.stock_quantity +
      " | " + (product.is_active ? "Active" : "Inactive");

    const edit = document.createElement("button");
    edit.textContent = "Edit Product";
    edit.onclick = () => editProduct(product);

    const toggle = document.createElement("button");
    toggle.className = product.is_active ? "danger" : "secondary";
    toggle.textContent = product.is_active ? "Deactivate Product" : "Activate Product";
    toggle.onclick = () => toggleProduct(product);

    item.append(title, details, edit, toggle);
    list.appendChild(item);
  });

  if (!data || data.length === 0) {
    list.textContent = "No products have been added yet.";
  }
}

async function editProduct(product) {
  const name = prompt("Product name:", product.name);
  if (name === null) return;

  const priceText = prompt("Selling price (GH₵):", product.selling_price);
  if (priceText === null) return;

  const stockText = prompt("Stock quantity:", product.stock_quantity);
  if (stockText === null) return;

  const price = Number(priceText);
  const stock = Number(stockText);

  if (!name.trim() || priceText.trim() === "" ||
      stockText.trim() === "" || !Number.isFinite(price) ||
      price < 0 || !Number.isInteger(stock) || stock < 0) {
    alert("Please enter valid product details.");
    return;
  }

  const {error} = await db.from("products").update({
    name: name.trim(),
    selling_price: price,
    stock_quantity: stock
  }).eq("id", product.id);

  if (error) {
    alert("Update failed: " + error.message);
    return;
  }

  alert("Product updated.");
  await loadProducts();
}

async function toggleProduct(product) {
  const action = product.is_active ? "deactivate" : "activate";

  if (!confirm("Are you sure you want to " + action + " this product?")) return;

  const {error} = await db.from("products")
    .update({is_active: !product.is_active})
    .eq("id", product.id);

  if (error) {
    alert("Could not update product: " + error.message);
    return;
  }

  await loadProducts();
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

db.auth.getSession().then(async ({data}) => {
  if (data.session) {
    currentUser = data.session.user;
    await checkAdmin();
  }
});
// ORDER MANAGEMENT
const originalLoadAll = loadAll;

loadAll = async function () {
  await originalLoadAll();
  await loadOrders();
};

function addOrdersSection() {
  if (document.getElementById("ordersSection")) return;

  const section = document.createElement("section");
  section.id = "ordersSection";

  const heading = document.createElement("h3");
  heading.textContent = "Manage Customer Orders";

  const refresh = document.createElement("button");
  refresh.className = "secondary";
  refresh.textContent = "Refresh Orders";
  refresh.onclick = loadOrders;

  const list = document.createElement("div");
  list.id = "ordersList";
  list.textContent = "Loading orders...";

  section.append(heading, refresh, list);
  document.getElementById("dashboard").appendChild(section);
}

async function loadOrders() {
  addOrdersSection();

  const list = document.getElementById("ordersList");
  list.textContent = "Loading orders...";

  const { data: orders, error } = await db
    .from("orders")
    .select("id, customer_id, address_id, total_amount, status, payment_status, created_at")
    .order("created_at", { ascending: false });

  if (error) {
    list.textContent = "Could not load orders: " + error.message;
    return;
  }

  list.innerHTML = "";

  if (!orders || orders.length === 0) {
    list.textContent = "No orders found.";
    return;
  }

  const addressIds = [...new Set(orders.map(o => o.address_id).filter(Boolean))];
  const orderIds = orders.map(o => o.id);

  const [addressResult, paymentResult] = await Promise.all([
    addressIds.length
      ? db.from("addresses")
          .select("id, recipient_name, phone, region, city, address_details")
          .in("id", addressIds)
      : Promise.resolve({ data: [], error: null }),

    db.from("payments")
      .select("id, order_id, payment_method, transaction_reference, amount, status")
      .in("order_id", orderIds)
  ]);

  if (addressResult.error || paymentResult.error) {
    list.textContent = "Could not load delivery or payment details: " +
      (addressResult.error || paymentResult.error).message;
    return;
  }

  const addresses = addressResult.data || [];
  const payments = paymentResult.data || [];

  orders.forEach(order => {
    const address = addresses.find(a => a.id === order.address_id);
    const payment = payments.find(p => p.order_id === order.id);

    const card = document.createElement("div");
    card.className = "item";

    function addText(text) {
      const p = document.createElement("p");
      p.textContent = text;
      card.appendChild(p);
    }

    addText("Order: " + order.id);
    addText("Date: " + new Date(order.created_at).toLocaleString());
    addText("Total: GH₵" + Number(order.total_amount).toFixed(2));

    addText("Customer: " + (address?.recipient_name || "Not available"));
    addText("Phone: " + (address?.phone || "Not available"));
    addText("Region: " + (address?.region || ""));
    addText("City: " + (address?.city || ""));
    addText("Address: " + (address?.address_details || ""));

    addText("Payment method: " + (payment?.payment_method || "Not available"));
    addText("Payment amount: GH₵" +
      Number(payment?.amount ?? order.total_amount).toFixed(2));

    addText("Current payment status: " +
      (payment?.status || order.payment_status));

    addText("Current order status: " + order.status);

    const referenceLabel = document.createElement("label");
    referenceLabel.textContent = "Transaction reference";
    card.appendChild(referenceLabel);

    const reference = document.createElement("input");
    reference.placeholder = "Enter reference after verifying payment";
    reference.value = payment?.transaction_reference || "";
    card.appendChild(reference);

    const paymentLabel = document.createElement("label");
    paymentLabel.textContent = "Payment status";
    card.appendChild(paymentLabel);

    const paymentStatus = document.createElement("select");

    ["pending", "paid", "failed"].forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value.toUpperCase();
      paymentStatus.appendChild(option);
    });

    paymentStatus.value = payment?.status || order.payment_status || "pending";
    card.appendChild(paymentStatus);

    const orderLabel = document.createElement("label");
    orderLabel.textContent = "Order status";
    card.appendChild(orderLabel);

    const orderStatus = document.createElement("select");

    ["pending", "processing", "completed", "cancelled"].forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value.toUpperCase();
      orderStatus.appendChild(option);
    });

    orderStatus.value = order.status || "pending";
    card.appendChild(orderStatus);

    const save = document.createElement("button");
    save.textContent = "Save Order Updates";

    save.onclick = async () => {
      if (!payment) {
        alert("Payment record not found. No changes were saved.");
        return;
      }

      if (paymentStatus.value === "paid" &&
          !confirm("Have you verified that the customer actually paid?")) {
        return;
      }

      save.disabled = true;
      save.textContent = "Saving...";

      const { error: paymentError } = await db
        .from("payments")
        .update({
          status: paymentStatus.value,
          transaction_reference: reference.value.trim()
        })
        .eq("id", payment.id);

      if (paymentError) {
        alert("Payment update failed: " + paymentError.message);
        save.disabled = false;
        save.textContent = "Save Order Updates";
        return;
      }

      const { error: orderError } = await db
        .from("orders")
        .update({
          payment_status: paymentStatus.value,
          status: orderStatus.value
        })
        .eq("id", order.id);

      if (orderError) {
        alert("Order update failed: " + orderError.message);
        save.disabled = false;
        save.textContent = "Save Order Updates";
        return;
      }

      alert("Order updated successfully.");
      await loadOrders();
    };

    card.appendChild(save);
    list.appendChild(card);
  });
}// NEW ORDER DASHBOARD NOTIFICATIONS
let orderNotificationStarted = false;
let knownOrderIds = new Set();
let lastOrderCheck = null;

function addOrderNotificationBox() {
  if (document.getElementById("orderNotifications")) return;

  const section = document.createElement("section");
  section.id = "orderNotifications";

  const heading = document.createElement("h3");
  heading.textContent = "New Order Notifications";

  const status = document.createElement("p");
  status.id = "notificationStatus";
  status.textContent = "Preparing notifications...";

  const enableButton = document.createElement("button");
  enableButton.className = "secondary";
  enableButton.textContent = "Enable Browser Notifications";

  enableButton.onclick = async () => {
    if (!("Notification" in window)) {
      status.textContent = "Browser notifications are not supported here.";
      return;
    }

    const permission = await Notification.requestPermission();

    status.textContent = permission === "granted"
      ? "Browser notifications enabled."
      : "Notifications were not enabled. Check your browser settings.";
  };

  const alerts = document.createElement("div");
  alerts.id = "newOrderAlerts";

  section.append(heading, status, enableButton, alerts);
  document.getElementById("dashboard").prepend(section);
}

async function checkForNewOrders() {
  if (!currentUser ||
      document.getElementById("dashboard").classList.contains("hidden")) {
    return;
  }

  const checkStarted = new Date().toISOString();

  let query = db
    .from("orders")
    .select("id, total_amount, created_at")
    .order("created_at", { ascending: false })
    .limit(20);

  if (lastOrderCheck) {
    query = query.gt("created_at", lastOrderCheck);
  }

  const { data, error } = await query;

  if (error) {
    document.getElementById("notificationStatus").textContent =
      "Could not check new orders: " + error.message;
    return;
  }

  const orders = data || [];

  if (lastOrderCheck === null) {
    orders.forEach(order => knownOrderIds.add(order.id));
    lastOrderCheck = checkStarted;
    document.getElementById("notificationStatus").textContent =
      "Notifications are active. Checking every 30 seconds.";
    return;
  }

  const newOrders = orders.filter(order => !knownOrderIds.has(order.id));

  orders.forEach(order => knownOrderIds.add(order.id));
  lastOrderCheck = checkStarted;

  newOrders.reverse().forEach(order => {
    const alerts = document.getElementById("newOrderAlerts");
    const alertItem = document.createElement("p");

    alertItem.textContent =
      "New order received! GH₵" +
      Number(order.total_amount).toFixed(2);

    alerts.prepend(alertItem);

    if ("Notification" in window &&
        Notification.permission === "granted") {
      new Notification("New Quojo Phages Shop Order", {
        body: "A new order worth GH₵" +
          Number(order.total_amount).toFixed(2) + " has arrived."
      });
    }

    loadOrders();
  });
}

function startOrderNotifications() {
  if (orderNotificationStarted) return;

  addOrderNotificationBox();
  orderNotificationStarted = true;

  checkForNewOrders();
  setInterval(checkForNewOrders, 30000);
}

const previousCheckAdmin = checkAdmin;

checkAdmin = async function () {
  await previousCheckAdmin();

  if (!document.getElementById("dashboard").classList.contains("hidden")) {
    startOrderNotifications();
  }
};</script>
</body>
</html>
